# Dojo 静态站点 + API 反向代理（由 install-on-server.sh 注入密钥）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/dojo;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /api/dojo/ {
        proxy_pass http://127.0.0.1:8000/api/dojo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/deepseek/ {
        proxy_pass https://api.deepseek.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.deepseek.com;
        proxy_set_header Authorization "Bearer __DEEPSEEK_KEY__";
    }

    location /api/rapidapi/ {
        proxy_pass https://tiktok-api6.p.rapidapi.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host tiktok-api6.p.rapidapi.com;
        proxy_set_header X-RapidAPI-Key __RAPIDAPI_KEY__;
        proxy_set_header X-RapidAPI-Host tiktok-api6.p.rapidapi.com;
    }

    location /api/ {
        proxy_pass https://m1.apifoxmock.com/m1/6400575-6097373-default/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host m1.apifoxmock.com;
    }
}
