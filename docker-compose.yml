services:
  api:
    build: ./server
    image: dojo-api
    container_name: dojo-api
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - UVICORN_RELOAD=0
    volumes:
      - dojo-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dojo-web
    image: dojo-web
    container_name: dojo-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dojo-data:
